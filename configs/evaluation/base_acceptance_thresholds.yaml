version: 1
status: proposed_not_frozen
freeze_before_production_checkpoint_review: true
tiny_overfit:
  maximum_final_loss: 0.05
  minimum_target_token_accuracy: 0.99
  maximum_optimizer_steps: 500
smoke_training:
  require_finite_loss: true
  maximum_invalid_token_ids: 0
  maximum_malformed_labels: 0
  maximum_train_validation_overlap: 0
  minimum_loss_improvement_fraction: 0.05
  loss_improvement_interval_tokens: 1048576
  require_checkpoint_resume: true
  require_deterministic_greedy_generation: true
  maximum_unexplained_skipped_steps: 0
base_quality:
  maximum_premature_eos_rate: 0.10
  maximum_repeated_4gram_rate: 0.10
  maximum_longest_repeated_span_tokens: 24
  minimum_distinct_2: 0.65
  minimum_distinct_3: 0.75
  maximum_prompt_copy_rate: 0.20
  maximum_invalid_unicode_count: 0
  maximum_malformed_token_count: 0
  maximum_max_length_rate: 0.25
  minimum_human_grammar_score_1_to_5: 3.0
  minimum_human_topic_continuity_score_1_to_5: 3.0
  minimum_human_prompt_relevance_score_1_to_5: 3.0
  require_source_specific_validation_non_regression: true
  note: >-
    These are proposed thresholds. They must be reviewed and changed, if
    necessary, before any production checkpoint outputs are inspected; after
    freezing, changes require a versioned decision record.
